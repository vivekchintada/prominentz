version: '3.9'

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resto
      POSTGRES_USER: resto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto_secure_pw_change_me}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resto']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Redis 7 (SSE pub-sub + rate limiting + caching) ────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Resto AI Platform ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://resto:${POSTGRES_PASSWORD:-resto_secure_pw_change_me}@postgres:5432/resto
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      # Add your own keys in .env or override via environment:
      # STRIPE_SECRET_KEY:
      # STRIPE_WEBHOOK_SECRET:
      # RESEND_API_KEY:
      # GROQ_API_KEY:

volumes:
  pgdata:
