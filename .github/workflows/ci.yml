name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-platform:
    name: Validate Web Platform (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resto_ci?schema=public"
      NEXTAUTH_SECRET: "ci_placeholder_secret_at_least_32_characters_long_for_test"
      NEXTAUTH_URL: "http://localhost:3000"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './platform/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Lint Check
        run: npm run lint

      - name: Production Build
        run: npm run build

  validate-mobile:
    name: Validate Mobile App (React Native / Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './mobile/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit
